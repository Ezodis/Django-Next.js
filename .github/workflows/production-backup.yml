name: Production backup
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install portable exporter dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          python -m pip install 'Django>=5.2,<5.3' 'django-storages[s3]>=1.14,<2'
      - name: Export and encrypt database and media
        env:
          BACKUP_ENV_JSON: ${{ secrets.PRODUCTION_BACKUP_ENV }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile, time
          from pathlib import Path
          configuration = json.loads(os.environ.pop('BACKUP_ENV_JSON'))
          os.environ.update(configuration)
          if not os.environ.get('BACKUP_AGE_RECIPIENT'):
              raise SystemExit('Missing public encryption recipient')
          directory = Path(os.environ['RUNNER_TEMP']) / 'production-backup'
          import sys
          sys.path.insert(0, 'backend')
          from config import backups
          original_verify = backups.verify
          def verify_with_restore(path):
              manifest = original_verify(path)
              container = 'production-backup-drill'
              subprocess.run(['docker', 'run', '-d', '--name', container, '--network', 'none',
                              '-e', 'POSTGRES_HOST_AUTH_METHOD=trust', 'postgres:18'],
                             check=True, stdout=subprocess.DEVNULL)
              try:
                  for attempt in range(60):
                      # The init-only server exposes a Unix socket before the final
                      # server starts. TCP readiness avoids restoring during shutdown.
                      ready = subprocess.run(['docker', 'exec', container, 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres'],
                                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if ready.returncode == 0:
                          break
                      time.sleep(1)
                  else:
                      raise RuntimeError('Recovery drill database did not start')
                  with tempfile.TemporaryDirectory() as temporary:
                      root = backups.extract(path, Path(temporary))
                      with (root / 'database.sql').open('rb') as incoming:
                          result = subprocess.run(['docker', 'exec', '-i', container, 'psql', '-X',
                              '-U', 'postgres', '-d', 'postgres', '--single-transaction',
                              '-v', 'ON_ERROR_STOP=1'], stdin=incoming, stdout=subprocess.DEVNULL,
                              stderr=subprocess.PIPE)
                      if result.returncode:
                          raise RuntimeError('Database recovery drill failed; snapshot was not published')
              finally:
                  subprocess.run(['docker', 'rm', '-f', container], check=True, stdout=subprocess.DEVNULL)
              return manifest
          backups.verify = verify_with_restore
          backups.create(directory)
          files = list(directory.glob('*.age'))
          if len(files) != 1 or files[0].stat().st_size >= 90 * 1024**2:
              raise SystemExit('Git backup exceeds 90 MiB; configure independent object storage before continuing')
          PY
      - name: Publish encrypted copy without changing deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/production-backup"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/production-backups; then
            git switch --track origin/production-backups
          else
            git checkout --orphan production-backups
            git rm -rf .
          fi
          mkdir -p snapshots
          mkdir -p frontend/web
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > frontend/web/vercel.json
          cp "$directory"/*.age "$directory"/*.sha256 snapshots/
          # Keep seven visible archives. Git history retains older encrypted copies.
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('snapshots').glob('*.age'), key=lambda p: p.name, reverse=True)
          for path in files[7:]:
              path.unlink()
              path.with_name(path.name + '.sha256').unlink(missing_ok=True)
          PY
          git add snapshots frontend/web/vercel.json
          git commit -m 'Store encrypted production snapshot'
          # Retry concurrent branch updates without force-pushing.
          for attempt in 1 2 3; do
            git push origin HEAD:production-backups && exit 0
            git fetch origin production-backups
            git rebase origin/production-backups
          done
          exit 1
